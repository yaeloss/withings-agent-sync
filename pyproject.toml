[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "withings-sync"
version = "0.1.0"
description = "Zero-dependency Withings to local JSON sync (body composition, activity, sleep)."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yael Ossowski" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
withings-sync = "withings_sync.__main__:main"

[tool.setuptools]
packages = ["withings_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
