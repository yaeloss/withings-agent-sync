[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "withings-agent-sync"
dynamic = ["version"]
description = "Private, zero-dependency Withings JSON sync for agents and local pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yael Ossowski" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: Console",
]

[project.scripts]
withings-agent-sync = "withings_agent_sync.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Repository = "https://github.com/yaeloss/withings-agent-sync"
Issues = "https://github.com/yaeloss/withings-agent-sync/issues"

[tool.setuptools]
packages = ["withings_agent_sync"]

[tool.setuptools.dynamic]
version = { attr = "withings_agent_sync.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
