name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Inspect source distribution
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive) as package:
              names = set(package.getnames())
          root = archive.name.removesuffix(".tar.gz")
          assert f"{root}/SECURITY.md" in names
          assert f"{root}/tests/conftest.py" in names
          assert f"{root}/tests/test_release.py" in names
          PY
      - name: Install wheel and source distribution outside the checkout
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            install_dir="$(mktemp -d "$RUNNER_TEMP/withings-install.XXXXXX")"
            python -m venv "$install_dir"
            "$install_dir/bin/python" -m pip install --no-deps "$artifact"
            (
              cd "$RUNNER_TEMP"
              "$install_dir/bin/withings-agent-sync" --help
              "$install_dir/bin/withings-agent-sync" --version
              "$install_dir/bin/python" -m withings_agent_sync --version
              "$install_dir/bin/python" -c 'from importlib.metadata import requires, version; from pathlib import Path; import sys, withings_agent_sync; assert version("withings-agent-sync") == withings_agent_sync.__version__; assert Path(withings_agent_sync.__file__).is_relative_to(sys.prefix); assert all("extra ==" in requirement for requirement in requires("withings-agent-sync") or [])'
            )
          done
